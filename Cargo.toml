[package]
name = "living-postmortem-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
rmcp = { version = "=1.5.0", features = ["transport-io"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
slugify = "0.1.0"
tokio = { version = "1.52.2", features = ["macros", "rt-multi-thread", "fs", "io-std"] }
