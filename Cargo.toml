[package]
name = "living-postmortem-mcp"
version = "0.1.1"
edition = "2024"
description = "MCP stdio server for incident postmortems stored as markdown in a vault."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Zandelok/living-postmortem-mcp"
homepage = "https://github.com/Zandelok/living-postmortem-mcp"
documentation = "https://docs.rs/living-postmortem-mcp"

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
rmcp = { version = "=1.5.0", features = ["transport-io"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
slugify = "0.1.0"
tokio = { version = "1.52.2", features = ["macros", "rt-multi-thread", "fs", "io-std"] }
